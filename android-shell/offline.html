<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FaceTube — Connection Unavailable</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        background-color: #0b0c11;
        color: #f4f4f5;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .card {
        max-width: 380px;
        width: 100%;
        padding: 28px 24px;
        border-radius: 20px;
        background-color: #14161f;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background-color: rgba(225, 29, 72, 0.16);
        border: 1px solid rgba(225, 29, 72, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 12px;
        font-size: 14px;
        line-height: 1.5;
        color: #a1a1aa;
      }
      .hint {
        margin: 0 0 22px;
        font-size: 12px;
        line-height: 1.5;
        color: #71717a;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 12px 18px;
        border-radius: 12px;
        background-color: #e11d48;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 9v4m0 4h.01M4.93 19h14.14c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.2 16c-.77 1.33.19 3 1.73 3z"
            stroke="#fb7185"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <h1>Unable to Connect to FaceTube</h1>
      <p>Please check your mobile data or Wi-Fi connection and try again.</p>
      <p class="hint">
        If you are online and continue seeing this screen, update Android System WebView from Google
        Play to continue using FaceTube securely.
      </p>
      <a class="btn" href="https://facetube.online/">Try Again</a>
    </main>
  </body>
</html>
