<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FaceTube</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        background-color: #0b0c11;
        color: #f4f4f5;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .card {
        max-width: 360px;
        width: 100%;
        padding: 28px 24px;
        border-radius: 20px;
        background-color: #14161f;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: linear-gradient(135deg, #e11d48, #be123c);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: #a1a1aa;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 12px 18px;
        border-radius: 12px;
        background-color: #e11d48;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M8 5.5v13l11-6.5-11-6.5z" fill="#ffffff" />
        </svg>
      </div>
      <h1>FaceTube</h1>
      <p>Open the live FaceTube experience over a secure connection.</p>
      <a class="btn" href="https://facetube.online/">Open FaceTube</a>
    </main>
  </body>
</html>
